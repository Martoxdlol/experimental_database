[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/storage",
    "crates/docstore",
    "crates/query",
    "crates/tx",
    "crates/database",
    "crates/replication",
    "crates/wire",
    "apps/server",
    "apps/cli",
    "apps/studio",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Internal crates
exdb-core         = { path = "crates/core" }
exdb-storage      = { path = "crates/storage" }
exdb-docstore     = { path = "crates/docstore" }
exdb-query        = { path = "crates/query" }
exdb-tx           = { path = "crates/tx" }
exdb              = { path = "crates/database" }
exdb-replication  = { path = "crates/replication" }
exdb-wire         = { path = "crates/wire" }

# Shared external deps
tokio       = { version = "1", features = ["full"] }
tokio-util  = { version = "0.7", features = ["rt"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
bson        = "2"
base64      = "0.22"
jsonwebtoken = { version = "10.4", features = ["rust_crypto"] }
prost       = "0.14"
thiserror   = "2"
tracing     = "0.1"
parking_lot = "0.12"
zerocopy    = { version = "0.8", features = ["derive"] }
crc32fast   = "1"
tempfile    = "3"
async-trait = "0.1"
futures-core = "0.3"
futures-util = "0.3"
async-stream = "0.3"
pin-project-lite = "0.2"
tokio-stream = "0.1"
lz4_flex    = "0.11"
rustls-pemfile = "2"
tokio-rustls = "0.26"
tokio-tungstenite = "0.28"
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "bloom"] }
